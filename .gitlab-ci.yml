# GitLab 파이프라인 (설계서 17장). Runner는 Windows 서버의 shell executor(PowerShell)로 등록한다.
# 이 단계에서는 build / test / security만 정의하고, package·deploy는 배포 자동화 단계에서 추가한다.
stages:
  - build
  - test
  - security

default:
  tags: [windows]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release

build:
  stage: build
  script:
    - dotnet build Portal.sln -c $env:CONFIGURATION
  artifacts:
    paths:
      - src/*/bin/
      - src/*/obj/
      - tests/*/bin/
      - tests/*/obj/
    expire_in: 1 day

test:
  stage: test
  needs: [build]
  script:
    - dotnet test Portal.sln -c $env:CONFIGURATION --no-build

security:
  stage: security
  needs: []
  script:
    - $out = dotnet list Portal.sln package --vulnerable --include-transitive | Out-String
    - Write-Output $out
    - if ($out -match "has the following vulnerable packages") { throw "취약 패키지가 있습니다." }
